[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calibration-designer-v3"
version = "0.1.0"
description = "Low-dose NIR reflectance calibration design app"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "matplotlib==3.9.2",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "pillow==10.4.0",
  "pydantic==2.9.2"
]

[dependency-groups]
dev = [
  "pytest==8.3.5"
]

[project.scripts]
calibration-designer-v3 = "calibration_designer_v3.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
calibration_designer_v3 = ["assets/*.png"]

[tool.pytest.ini_options]
minversion = "7.4"
addopts = "-q"
testpaths = ["tests"]
